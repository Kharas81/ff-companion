name: Check FF Companion Guide
on:
  push:
    paths:
      - "data/**"
      - "scripts/validate_guide.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_guide.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_guide.py
